<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>workouts</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="workouts">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="stylesheet" href="/web/tokens.css">
<link rel="stylesheet" href="/web/base.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="bar">
    <span class="brand" id="block-label">workouts</span>
    <span id="pending" class="pending hidden" role="status"></span>
    <span class="spacer"></span>
    <button id="btn-routines">Program</button>
  </div>
  <div class="bar log-only">
    <select id="week-select" aria-label="week"></select>
    <select id="day-select" aria-label="day"></select>
  </div>
</header>

<main>
  <p id="status">loading</p>
  <div id="log-view" class="view log-only">
    <div id="sets"></div>
    <div class="bar{{if not .Embed}} hidden{{end}}">
      <button id="btn-sheet">Sheet</button>
    </div>
    <iframe id="sheet" class="hidden" title="spreadsheet" data-src="{{.Embed}}"></iframe>
  </div>
  <div id="routine-view" class="view routines-only"></div>
</main>

<script type="module" src="/static/ui.js"></script>
</body>
</html>
