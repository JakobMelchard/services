name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    uses: JakobMelchard/.github/.github/workflows/release.yml@4258fca96cbd14e90054debed585f9cf8aad04f7 # v2.1.0
    permissions:
      contents: read
      id-token: write

  # The workouts phone app (capacitor/), signed with the fz keystore from
  # Infisical's /release folder and attached to the release for Obtainium.
  apk:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '"blacksmith-2vcpu-ubuntu-2404"') }}
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"   # @capacitor/android 8 compiles for Java 21

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # Before the secrets are loaded, so npm install scripts never see the keystore.
      - name: web build
        working-directory: capacitor
        run: npm ci --no-audit --no-fund && npm run build && npx cap sync android

      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: b1ede60d-f7a7-4699-86ec-eea6ac51be30 # gha-org
          domain: https://eu.infisical.com
          project-slug: gha-lfq-y
          env-slug: dev
          secret-path: /release

      - name: build
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          IFS=. read -r major minor patch <<<"$VERSION"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          # The keystore has no "fz" alias: unless /release sets ANDROID_KEY_ALIAS, sign with its only key.
          if [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            ANDROID_KEY_ALIAS=$(keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" |
              awk -F', ' '/PrivateKeyEntry/ { print $1; exit }')
            export ANDROID_KEY_ALIAS
          fi
          echo "signing with alias: $ANDROID_KEY_ALIAS"
          cd capacitor/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PversionName="$VERSION" -PversionCode="$((major * 10000 + minor * 100 + patch))"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/workouts-$VERSION.apk"

      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "workouts-$VERSION.apk" --clobber
