name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    uses: JakobMelchard/.github/.github/workflows/release.yml@531b4dcb30293e6219d67e312e164cc262a69955 # v2.3.1
    permissions:
      contents: read
      id-token: write

  # The workouts phone app (capacitor/), signed with the fz keystore from
  # Infisical's /release folder and attached to the release for Obtainium.
  apk:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '"blacksmith-2vcpu-ubuntu-2404"') }}
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"   # @capacitor/android 8 compiles for Java 21

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # Install scripts could plant code that runs later with the secrets, so none run;
      # the lockfile has no package with one.
      - name: web build
        working-directory: capacitor
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build && npx cap sync android

      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: b1ede60d-f7a7-4699-86ec-eea6ac51be30 # gha-org
          domain: https://eu.infisical.com
          project-slug: gha-lfq-y
          env-slug: dev
          secret-path: /release

      - name: build
        run: .github/scripts/build-release-apk.sh

      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "workouts-$VERSION.apk" --clobber
