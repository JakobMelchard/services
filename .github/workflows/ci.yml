name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: JakobMelchard/.github/.github/workflows/go.yml@e1ef2b10e7ee0c5426f78d63a4e9c6a0ce9b3fe9 # v1.6.0
    with:
      # staticcheck v0.8 needs Go 1.26, the go directive in go.mod.
      go-version: "1.26"
      vet-cmd: make vet lint
      test-cmd: make test
      build-cmd: make build

  hooks:
    uses: JakobMelchard/.github/.github/workflows/hooks.yml@e1ef2b10e7ee0c5426f78d63a4e9c6a0ce9b3fe9 # v1.6.0

  # Capacitor shell (capacitor/): the web UI bundled into native apps against
  # https://workouts.lilfeelz.org. Debug APK as the Android proof.
  android:
    uses: JakobMelchard/.github/.github/workflows/android.yml@e1ef2b10e7ee0c5426f78d63a4e9c6a0ce9b3fe9 # v1.6.0
    with:
      java-version: "21"   # @capacitor/android 8 compiles for Java 21
      setup-cmd: cd capacitor && npm ci --no-audit --no-fund && npm run build && npx cap sync android
      working-directory: capacitor/android
      gradle-tasks: assembleDebug
      artifact-path: capacitor/android/app/build/outputs/apk/debug/*.apk

  # Simulator build only, no signing, no tests. Runs on mimi like attach (lilfeelz/workspaces
  # attach-ci.yml): the runner is j's own session, so never third-party code (dependency bots),
  # the reusable workflow is pinned, runs-on is one label (xcode.yml takes no fromJSON), and the
  # runner's PATH lacks Homebrew (node).
  ios:
    if: ${{ !endsWith(github.actor, '[bot]') }}
    uses: JakobMelchard/.github/.github/workflows/xcode.yml@e1ef2b10e7ee0c5426f78d63a4e9c6a0ce9b3fe9 # v1.6.0
    with:
      runs-on: self-hosted
      working-directory: capacitor/ios/App
      generate-cmd: >-
        export PATH=/opt/homebrew/bin:$PATH &&
        cd ../.. && npm ci --no-audit --no-fund && npm run build && npx cap sync ios
      lint-cmd: ""
      test-cmd: >-
        set -o pipefail &&
        xcodebuild -project App.xcodeproj -scheme App -destination 'generic/platform=iOS Simulator'
        -skipMacroValidation -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build
        2>&1 | tee xcodebuild.log | grep -E 'error:|warning: |\*\*'
