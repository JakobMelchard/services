name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: JakobMelchard/.github/.github/workflows/go.yml@4258fca96cbd14e90054debed585f9cf8aad04f7 # v2.1.0
    with:
      # staticcheck v0.8 needs Go 1.26, the go directive in go.mod.
      go-version: "1.26"
      vet-cmd: make vet lint
      test-cmd: make test
      build-cmd: make build

  hooks:
    uses: JakobMelchard/.github/.github/workflows/hooks.yml@4258fca96cbd14e90054debed585f9cf8aad04f7 # v2.1.0
    with:
      skip: tsc,prettier,eslint # need node_modules; the js job runs them

  # The pages' JS, its tests and the scripts: JSDoc types (tsconfig.json), prettier, eslint.
  js:
    uses: JakobMelchard/.github/.github/workflows/node.yml@4258fca96cbd14e90054debed585f9cf8aad04f7 # v2.1.0
    with:
      check-cmd: npx tsc && npx prettier --check .
      lint-cmd: npx eslint . --max-warnings 0

  # Capacitor shell (capacitor/): the web UI bundled into native apps against
  # https://workouts.lilfeelz.org. Debug APK as the Android proof.
  android:
    uses: JakobMelchard/.github/.github/workflows/android.yml@4258fca96cbd14e90054debed585f9cf8aad04f7 # v2.1.0
    with:
      java-version: "21"   # @capacitor/android 8 compiles for Java 21
      setup-cmd: cd capacitor && npm ci --no-audit --no-fund && npm run build && npx cap sync android
      working-directory: capacitor/android
      gradle-tasks: assembleDebug
      artifact-path: capacitor/android/app/build/outputs/apk/debug/*.apk
