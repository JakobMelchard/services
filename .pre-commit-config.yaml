# Hooks come from pinned repos; Renovate bumps the revs. CI runs the same config through
# JakobMelchard/.github hooks.yml. Setup: brew install prek && prek install
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
  - repo: https://github.com/JakobMelchard/.githooks
    rev: v1.0.1
    hooks:
      - id: conventional-commit
      - id: gofmt
      - id: go-build
      - id: prettier
      - id: eslint
  - repo: local
    hooks:
      - id: tsc
        name: tsc (repo-installed)
        entry: npx --no-install tsc
        language: system
        types_or: [javascript, ts]
        pass_filenames: false
